server.port=8080

# Base de datos H2 embebida: vive dentro de la aplicacion Java, en memoria.
# No hay que instalar MySQL ni crear nada: se crea sola cada vez que arranca el backend.
# MODE=MySQL hace que H2 entienda la misma sintaxis SQL que MySQL.
spring.datasource.url=jdbc:h2:mem:ferreteria;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Al arrancar se ejecutan schema.sql (crea la tabla) y data.sql (inserta los 10.000 productos)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
